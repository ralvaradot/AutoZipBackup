[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "autozipbackup"
version = "0.1.0"
description = "Automated folder backup application for Windows."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AutoZipBackup Team" }
]

dependencies = [
    "ttkbootstrap>=1.10",
    "APScheduler>=3.10,<4",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]


[project.scripts]
autozipbackup = "autozip.main:main"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = [
    "src"
]

testpaths = [
    "tests"
]


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]